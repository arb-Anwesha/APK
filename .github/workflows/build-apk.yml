name: Build and Release Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Setup environment files
      run: |
        # Ensure .env exists for the secrets-gradle-plugin
        if [ ! -f .env ]; then
          cp .env.example .env 2>/dev/null || touch .env
        fi

    - name: Build Android Debug APK
      run: gradle :app:assembleDebug --no-daemon --stacktrace

    - name: Verify APK exists
      run: |
        test -f app/build/outputs/apk/debug/app-debug.apk || { echo "APK file not found!"; exit 1; }
        ls -lh app/build/outputs/apk/debug/app-debug.apk

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Anweshar-Video-Studio-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
